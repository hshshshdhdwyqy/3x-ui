zerops:
  - setup: app
    run:
      base: alpine/docker@26.1.5
      prepareCommands:
        - docker image pull ghcr.io/mhsanaei/3x-ui:latest
      start: >-
        docker run --network=host
        -v /var/www/db:/etc/x-ui
        -v /var/www/cert:/root/cert
        ghcr.io/mhsanaei/3x-ui:latest
      ports:
        - port: 2053
          httpSupport: true
